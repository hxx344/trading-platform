name: ci
on:
  push:
    branches: [main]
  pull_request:
  # A manual run also measures each test file on a runner, for scripts/test-durations.json.
  workflow_dispatch:
    inputs:
      install_full:
        description: 用不带参数的完整顺序验收安装，并运行真实 systemd 部署
        type: boolean
        default: false
permissions:
  contents: read
# A new push to a PR supersedes its running checks. Each run on main gets its own group, so none is queued or cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Each job below runs in parallel; the slowest decides the run's wall time, so the long suites are split into shards.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The same two projects as "check" in package.json (keep them in step), side by side; both report before a failure.
      - name: tsc（两个项目）
        run: |
          node_modules/.bin/tsc -p tsconfig.json &
          server=$!
          node_modules/.bin/tsc -p web/tsconfig.json || { wait "$server" || true; exit 1; }
          wait "$server"

  # Needs no Node, so it skips the setup the other jobs share.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck deploy/*.sh
      - run: python3 -I -B deploy/main-watch/test_main_watch.py

  # deploy/test-install.sh in its three independent parts; each starts from its own first install.
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(inputs.install_full && '["all"]' || '[1,2,3]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The package and its config check include the built page.
      - run: npm run build:web
      - if: matrix.part != 'all'
        run: bash deploy/test-install.sh ${{ matrix.part }}
      - if: matrix.part == 'all'
        run: bash deploy/test-install.sh

  platform-systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: 检查安装、单元及进程边界是否变化
        id: affected
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]] && git fetch --no-tags --depth=1 origin "$BASE" &&
              git diff --quiet "$BASE" HEAD -- .github/workflows/ci.yml 'deploy/trading-platform*' deploy/install.sh deploy/package.sh deploy/test-platform-systemd.sh \
                src/control 'src/http*.ts' src/runtime.ts src/component-build.ts src/web-assets.ts src/data-dir.ts src/login-password.ts src/live/setup.ts \
                src/service/main.ts 'src/service/*config*.ts' 'src/service/update*.ts' src/service/handoff-file.ts 'src/service/import-*.ts'; then
            echo "run=false" >>"$GITHUB_OUTPUT"
          else
            echo "run=true" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.affected.outputs.run == 'true'
        uses: ./.github/actions/setup
      - if: steps.affected.outputs.run == 'true'
        run: npm run build:web
      - if: steps.affected.outputs.run == 'true'
        run: sudo env PATH="$PATH" TP_PLATFORM_DISPOSABLE_CI=1 GITHUB_ACTIONS=true bash deploy/test-platform-systemd.sh

  # scripts/test.ts deals the test files into shards by their CI durations (scripts/test-durations.json).
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Some tests start the service, whose config check requires the built page.
      - run: npm run build:web
      - run: npm test
        env:
          TEST_SHARD: ${{ matrix.shard }}/6

  # The second server's watchdog (docs/watch.md) installed on a real systemd: units, sandbox, alert round, upgrade, uninstall.
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 一次性 runner 上把安装路径整理为只有 root 可写
        run: |
          for path in /opt /usr/local /usr/local/bin; do
            test -d "$path" && test ! -L "$path"
            sudo setfacl --remove-all --remove-default "$path"
            sudo chown root:root "$path"
            sudo chmod go-w "$path"
          done
      - run: sudo env PATH=/usr/sbin:/usr/bin:/sbin:/bin TP_WATCH_DISPOSABLE_CI=1 GITHUB_ACTIONS=true bash deploy/test-watch-systemd.sh

  durations:
    if: github.event_name == 'workflow_dispatch' && !inputs.install_full
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run build:web
      - run: node scripts/test.ts --measure
      # Uploaded even when a file failed: that file keeps its old duration, and the job still fails.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-durations
          path: scripts/test-durations.json
