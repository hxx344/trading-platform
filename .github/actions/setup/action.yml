name: setup
description: Node 24.15.0 and node_modules. A cache hit on the lockfile and manifest skips pnpm entirely; package.json scripts then run through npm run.
runs:
  using: composite
  steps:
    # The Node version is set once here. The manifest hash leaves out "version", which every release commit bumps, so
    # main's pushes can reuse node_modules; any other change to package.json (dependencies, scripts, pnpm settings) still
    # gives a new key.
    - id: keys
      shell: bash
      run: |
        # Assigned first so a failing jq fails the step instead of leaving the hash of empty input in the key.
        manifest=$(jq -S 'del(.version)' package.json | sha256sum | cut -c1-64)
        echo "node=24.15.0" >>"$GITHUB_OUTPUT"
        echo "manifest=$manifest" >>"$GITHUB_OUTPUT"
    # setup-node uses an exact version already in the tool cache instead of downloading and unpacking it.
    - uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/node/${{ steps.keys.outputs.node }}
        key: node-tool-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.node }}
    - id: node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ steps.keys.outputs.node }}
    # Exact key only: a node_modules from another lockfile or manifest is never restored.
    - id: modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ steps.keys.outputs.manifest }}
    - if: steps.modules.outputs.cache-hit != 'true'
      uses: pnpm/action-setup@v4
    - if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
    # The Lighter signer (src/varlighter/signer/lighter-signer.wasm and wasm_exec.js) is compiled from pinned sources by
    # scripts/build-lighter-signer.sh and never committed; the tests and deploy/package.sh need both files. The script holds
    # the Go version and the source commit, so its hash and the committed checksums make the key. A restored cache is still
    # checked against SHA256SUMS by the script, which then returns without compiling (and without Go).
    - id: signer
      shell: bash
      run: echo "go=$(bash scripts/build-lighter-signer.sh --go-version)" >>"$GITHUB_OUTPUT"
    - id: signer-cache
      uses: actions/cache@v4
      with:
        path: |
          src/varlighter/signer/lighter-signer.wasm
          src/varlighter/signer/wasm_exec.js
        key: lighter-signer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-lighter-signer.sh', 'src/varlighter/signer/SHA256SUMS') }}
    - if: steps.signer-cache.outputs.cache-hit != 'true'
      uses: actions/setup-go@v5
      with:
        go-version: ${{ steps.signer.outputs.go }}
        cache: false
    - shell: bash
      run: bash scripts/build-lighter-signer.sh
